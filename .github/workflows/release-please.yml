name: Release Please

# Keeps a release PR open against main and, once it merges, publishes the
# GitHub release and its BRAT assets (main.js, manifest.json, styles.css).
# Per-push BRAT betas come from beta-release.yml.
#
# The release PR is opened and updated with a Forge Bellows App token, not
# GITHUB_TOKEN, so CI runs on it and the nightly ship gate (ship.yml,
# cadence-ecosystem ADR-0044) can verify and merge it. The versions.json entry
# for the new version is committed into the release PR here, so nothing pushes
# to main after the release.
on:
  push:
    branches: [main]

permissions: {}

# Serialize. Two runs racing would fight over the same release PR branch.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR
    runs-on: ubuntu-latest
    # RELEASE_APP_PRIVATE_KEY lives only in the `release` environment, whose
    # deployment policy allows `main` (ADR-0044 (i)). This job runs no
    # checkout and no repository code while it holds the key.
    environment: release
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Generate Forge Bellows token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please cannot add a key to versions.json (its `json` updater
      # only sets an existing jsonpath), so add the entry for the release
      # PR's version here, as a commit on the release PR branch. The commit
      # goes through the Git Data API with the App token, so GitHub signs it
      # and the ship gate's signature and content checks accept it
      # (versions.json: base plus exactly one new key). Idempotent: skipped
      # when the key already exists. release-please rebuilds the branch when
      # main moves, and the next run adds the entry again.
      - name: Add versions.json entry to the release PR
        # Skipped on the release run itself, so a failure here can never hold
        # back the asset upload for a release that already exists.
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: main
          BOT_LOGIN: artificer-forge-bellows[bot]
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          raw='Accept: application/vnd.github.raw+json'
          title_re='^chore(\(main\))?: release v?[0-9]+\.[0-9]+\.[0-9]+$'

          prs="$(gh api "repos/${REPO}/pulls?state=open&base=${BASE}&per_page=100")"
          heads="$(jq -r --arg bot "$BOT_LOGIN" --arg repo "$REPO" --arg re "$title_re" '
              if type != "array" then error("pull list is not an array") else . end
              | .[] | select(.user.login == $bot and .head.repo.full_name == $repo
                             and (.title | test($re)) and (.head.ref | startswith("release-please--")))
              | .head.ref' <<< "$prs")"
          if [[ -z "$heads" ]]; then
            echo "No open release PR from ${BOT_LOGIN}; nothing to add."
            exit 0
          fi
          count="$(wc -l <<< "$heads" | tr -d ' ')"
          if [[ "$count" != 1 ]]; then
            echo "::error::${count} open release PRs from ${BOT_LOGIN}; expected one"
            exit 1
          fi
          branch="$heads"
          [[ "$branch" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::unexpected branch name"; exit 1; }

          head_sha="$(gh api "repos/${REPO}/git/ref/heads/${branch}" --jq '.object.sha')"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head is not 40-hex"; exit 1; }
          version="$(gh api -H "$raw" "repos/${REPO}/contents/.release-please-manifest.json?ref=${head_sha}" | jq -r '."."')"
          [[ "$version" =~ $semver ]] || { echo "::error::manifest version is not X.Y.Z"; exit 1; }
          min_app="$(gh api -H "$raw" "repos/${REPO}/contents/manifest.json?ref=${head_sha}" | jq -r '.minAppVersion')"
          [[ "$min_app" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::minAppVersion is not X.Y or X.Y.Z"; exit 1; }
          versions="$(gh api -H "$raw" "repos/${REPO}/contents/versions.json?ref=${head_sha}")"
          jq -e 'type == "object"' <<< "$versions" > /dev/null || { echo "::error::versions.json is not an object"; exit 1; }

          if jq -e --arg v "$version" 'has($v)' <<< "$versions" > /dev/null; then
            echo "versions.json on ${branch} already has ${version}."
            exit 0
          fi
          content="$(jq --arg v "$version" --arg m "$min_app" '. + {($v): $m}' <<< "$versions")"

          blob="$(jq -n --arg c "${content}"$'\n' '{content: $c, encoding: "utf-8"}' \
            | gh api "repos/${REPO}/git/blobs" --input - --jq '.sha')"
          base_tree="$(gh api "repos/${REPO}/git/commits/${head_sha}" --jq '.tree.sha')"
          tree="$(jq -n --arg b "$base_tree" --arg s "$blob" \
              '{base_tree: $b, tree: [{path: "versions.json", mode: "100644", type: "blob", sha: $s}]}' \
            | gh api "repos/${REPO}/git/trees" --input - --jq '.sha')"
          commit="$(jq -n --arg t "$tree" --arg p "$head_sha" --arg m "chore: add ${version} to versions.json" \
              '{message: $m, tree: $t, parents: [$p]}' \
            | gh api "repos/${REPO}/git/commits" --input -)"
          # The ship gate requires both; check them here so a mismatch
          # shows up now, not at the nightly run.
          jq -e '.verification.verified == true and .verification.reason == "valid"' \
            <<< "$commit" > /dev/null \
            || { echo "::error::GitHub did not sign the versions.json commit"; exit 1; }
          commit_sha="$(jq -r '.sha' <<< "$commit")"
          # force=false: refused if the branch moved since head_sha was read.
          jq -n --arg s "$commit_sha" '{sha: $s, force: false}' \
            | gh api -X PATCH "repos/${REPO}/git/refs/heads/${branch}" --input - > /dev/null
          echo "Added ${version}: ${min_app} to versions.json on ${branch} (${commit_sha})."

  build:
    name: Build release assets
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit release-please tagged, not the tag name: a writer
          # could move a tag, not this SHA.
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 1

  # Separate from the build so the job that can write releases runs no
  # dependency code. Uploading assets to a release is not a push to main.
  publish:
    name: Upload release assets
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: assets

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag is not X.Y.Z"; exit 1; }
          gh release upload "$TAG_NAME" -R "$REPO" --clobber \
            assets/main.js assets/manifest.json assets/styles.css
